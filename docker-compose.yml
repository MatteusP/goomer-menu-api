version: "3.3"

services:
  api:
    build: .
    container_name: goomer-api
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: goomer
      DB_PASSWORD: goomer
      DB_NAME: goomer_db
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: goomer-db
    environment:
      POSTGRES_USER: goomer
      POSTGRES_PASSWORD: goomer
      POSTGRES_DB: goomer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
